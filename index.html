<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English ABC & Spelling Game</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        .game-card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 550px; position: relative; z-index: 10; border: 4px solid #4a90e2; }
        
        /* Welcome & Instructions Screen */
        #login-screen input { padding: 12px; font-size: 1.1rem; border-radius: 10px; border: 2px solid #ddd; width: 80%; margin-bottom: 15px; text-align: center; }
        #login-screen button, .next-btn { padding: 12px 30px; background: #4a90e2; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; transition: 0.2s; }
        #login-screen button:hover, .next-btn:hover { background: #357abd; }
        .instructions-box { background: #e8f0fe; padding: 15px; border-radius: 12px; text-align: left; margin: 15px 0; font-size: 1rem; color: #333; line-height: 1.5; }

        /* ABC Board Screen */
        .abc-grid { display: grid; grid-template-columns: repeat(block, grid); grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin: 20px 0; max-height: 300px; overflow-y: auto; padding: 5px; }
        .letter-btn { background: #fff; border: 2px solid #4a90e2; font-size: 1.4rem; font-weight: bold; color: #4a90e2; padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .letter-btn.viewed { background: #e8f0fe; border-color: #a4c2f4; color: #a4c2f4; }
        
        /* Modal Pop-up for Letter details */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 300px; width: 80%; border: 4px solid #ff9800; }
        
        /* Spelling Screen */
        .spelling-img { font-size: 80px; margin: 15px 0; }
        .word-slots { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .slot { width: 45px; height: 45px; border-bottom: 4px solid #333; font-size: 1.8rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .letters-bank { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .bank-btn { padding: 10px 15px; font-size: 1.5rem; font-weight: bold; background: #fff; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; }
        .correct-slot { color: #4caf50; }
